name: 🐛 Bug report
description: Report a bug you encountered in Teja Game Hub
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below.

  - type: input
    id: game
    attributes:
      label: Game / Area
      description: Which game or feature is affected? (e.g. "Neon Snake", "Scoreboard", "Character card")
      placeholder: e.g. Neon Snake
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
      placeholder: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: (e.g. Chrome 120 on Windows 11, Safari 17 on macOS)
      placeholder: e.g. Chrome 120 / Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console logs / screenshots
      description: Paste any relevant console errors, or attach screenshots.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have reproduced the bug on the latest version of the page
          required: false
